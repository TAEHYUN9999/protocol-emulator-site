<text x="20.0" y="352.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#57606a">Hart 0 runs i0, i1, i2, i3 one per tick while hart 1 waits on a pin: a hart that stalls uses only its own clocks.</text>
<text x="20.0" y="372.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#57606a">The SRAM takes a hart's next PC while that hart executes, gives the word in the other hart's clock, and the word</text>
<text x="20.0" y="390.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#57606a">is registered for the hart's next turn (docs/architecture.md, Timing and Memory choice).</text>
